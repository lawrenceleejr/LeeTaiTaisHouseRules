<header class="site-header">
  <div class="wrap header-wrap">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <span class="brand-seal" aria-hidden="true">李</span>
      <span class="brand-name">Lee&nbsp;TaiTai’s <em>House&nbsp;Rules</em></span>
    </a>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      {{- $current := . }}
      {{- range site.Menus.main }}
      <a href="{{ .URL }}" {{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) (and (eq .PageRef "/learn") (eq $current.Section "learn")) }}class="active" aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></g></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" fill="currentColor"/></svg>
      </button>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
